[package]
name = "defi_vault"
version = "0.1.0"
description = "Yield / staking vault MVP for Solana Devnet"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "defi_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ip = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
